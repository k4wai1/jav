name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (runner already provides SDK)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          SDMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDMGR" --sdk_root="$SDK_ROOT" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build Jam companion APK (debug)
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Stage APK as jav-companion.apk
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk jav-companion.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jav-companion-apk
          path: jav-companion.apk
          if-no-files-found: error

  release:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: jav-companion-apk
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
