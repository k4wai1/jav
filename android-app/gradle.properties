# jev-android-mcp — perfil conservador para máquinas de 2 núcleos / ~2 GB RAM.
# Ver AGENTS.md §7. No subir Xmx sin medir: el Celeron + swap lo pagan caro.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official
