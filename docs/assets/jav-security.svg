  <text x="740" y="432" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" fill="#546E7A">grant 1 cmd / 5 / 30 min</text>

  <rect x="860" y="380" width="160" height="58" rx="10" fill="#EDE7F6" stroke="#B0BEC5"/>
  <text x="940" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#263238">audit ring 500</text>
  <text x="940" y="419" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" fill="#546E7A">16-hex arg hashes · origin</text>
  <text x="940" y="432" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" fill="#546E7A">never raw args or token</text>

