  <text x="24" y="498" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" fill="#78909C">Shizuku is started by the user and never auto-started by Jav · without it the shell lane fails with SHIZUKU_UNAVAILABLE, honestly.</text>
