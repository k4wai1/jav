  <text x="24" y="54" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#78909C">No root · no 0.0.0.0 · token on every bind · honest errors · irreversible actions double-gated</text>

