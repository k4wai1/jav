[project]
name = "jev-mcp"
version = "0.1.0"
description = "MCP server for Jam (jev-android-mcp): Jev-driven Android control"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14,<16",
    "mcp>=1.8,<2",  # v1: FastMCP estable; v2 renombra a MCPServer (no migrar en Fase 4)
    "httpx>=0.27",  # jev_client (Fase 5)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
